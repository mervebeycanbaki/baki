name: Binance Coin Mapping Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: CMC coinlerini Binance USDT pariteleriyle eslestir
        run: python test_binance_symbol_mapping.py

      - name: Eslesme CSV dosyasini indirilebilir olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: binance-symbol-mapping
          path: reports/binance_symbol_mapping.csv
          if-no-files-found: error
          retention-days: 7
