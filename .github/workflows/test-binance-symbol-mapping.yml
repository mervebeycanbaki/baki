              if (
                  item.get("status") == "TRADING"
                  and item.get("quoteAsset") == "USDT"
                  and item.get("isSpotTradingAllowed", False) is True
              ):
                  base = (item.get("baseAsset") or "").upper()
                  pair = (item.get("symbol") or "").upper()
