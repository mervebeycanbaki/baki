                  name = (row.get("name") or "").strip()
                  symbol = (row.get("symbol") or "").strip().upper()
                  if cmc_id and symbol:
                      coins.append({
                          "cmc_id": cmc_id,
                          "name": name,
                          "cmc_symbol": symbol
                      })

          if not coins:
              raise SystemExit("HATA: Son CMC CSV dosyasinda coin bulunamadi.")

          print(f"CMC snapshot: {latest_file.name}")
          print(f"CMC coin kaydi: {len(coins)}")
          print("Binance spot sembolleri aliniyor...")

