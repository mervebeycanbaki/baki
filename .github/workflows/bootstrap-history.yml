
name: Ilk Gecmis Veri Yuklemesi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kutuphaneyi kur
        run: python -m pip install requests

      - name: Ilk 1 yillik veriyi topla
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python bootstrap_history.py

      - name: Verileri GitHub'a kaydet
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni veri bulunamadi."
          else
            git commit -m "Ilk CMC gecmis verileri eklendi"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
