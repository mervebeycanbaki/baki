
name: BSC Erken Coin Avcisi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: bsc-early-coin-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: BSC token taramasi
        env:
          BSC_TELEGRAM_BOT_TOKEN: ${{ secrets.BSC_TELEGRAM_BOT_TOKEN }}
          BSC_TELEGRAM_CHAT_ID: ${{ secrets.BSC_TELEGRAM_CHAT_ID }}
        run: python bsc_early_hunter.py

      - name: Sinyal gecmisini GitHub'a kaydet
        if: success()
        run: |
          if [ -f bsc_signal_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add bsc_signal_history.json

            if ! git diff --cached --quiet; then
              git commit -m "Update BSC signal history"

              git pull --rebase origin "$GITHUB_REF_NAME"

              git push

              echo "Sinyal gecmisi GitHub'a kaydedildi."
            else
              echo "Sinyal gecisminde degisiklik yok."
            fi
          else
            echo "Sinyal gecmisi dosyasi olusmadi."
          fi
