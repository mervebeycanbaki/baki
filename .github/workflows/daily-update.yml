
name: Gunluk CMC Veri Guncelleme

on:
  schedule:
    # Her gun 03:20 Turkiye saati
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-cmc-volume-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Gerekli kutuphaneyi kur
        run: python -m pip install --upgrade pip requests

      - name: Gunluk hacimleri guncelle
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python update_history.py

      - name: Yeni verileri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Yeni veri yok."
          else
            git commit -m "Gunluk CMC hacim verileri guncellendi"
            git push
          fi
